<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profiles - Batman Theme</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* Keep all your existing Batman theme CSS styles from the previous code */
        :root {
            --batman-black: #080808;
            --pure-black: #000000;
            --batman-red: #DC143C;
            --dark-gray: #515155;
            --light-gray: #7F8086;
            --deep-red: #8B0000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--batman-black) 0%, var(--pure-black) 100%);
            color: var(--light-gray);
            font-family: 'Roboto', 'Arial', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Batman Loading Animation - Keep all previous styles */
        .batman-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, var(--batman-black) 0%, var(--pure-black) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        /* Keep all other existing styles... */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 0;
        }

        .header h1 {
            color: var(--batman-red);
            font-size: 3rem;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .controls {
            text-align: center;
            margin: 30px 0;
        }

        .search-box {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--batman-red);
            color: var(--light-gray);
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            margin-right: 10px;
            width: 300px;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--deep-red);
            box-shadow: 0 0 10px rgba(220, 20, 60, 0.3);
        }

        .btn-batman {
            background: linear-gradient(135deg, var(--batman-red), var(--deep-red));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(220, 20, 60, 0.3);
            text-decoration: none;
            display: inline-block;
            letter-spacing: 1px;
            margin: 5px;
        }

        .btn-batman:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(220, 20, 60, 0.5);
        }

        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .profile-card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--batman-red);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(220, 20, 60, 0.3);
        }

        .profile-card:hover {
            border-color: var(--deep-red);
            box-shadow: 0 8px 30px rgba(220, 20, 60, 0.5);
            transform: translateY(-5px);
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--batman-red);
            margin: 0 auto 20px;
            display: block;
        }

        .profile-username {
            color: var(--batman-red);
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .profile-description {
            color: var(--light-gray);
            font-size: 1rem;
            margin-bottom: 20px;
            line-height: 1.4;
            min-height: 50px;
        }

        .loading-message {
            text-align: center;
            color: var(--batman-red);
            font-size: 1.2rem;
            margin: 40px 0;
        }

        .error-message {
            text-align: center;
            color: var(--deep-red);
            font-size: 1.1rem;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <!-- Batman Loading Animation -->
    <div class="batman-loader" id="loader">
        <div class="bat-symbol">
            <div class="wing left-wing"></div>
            <div class="wing right-wing"></div>
            <div class="body"></div>
        </div>
        <div class="loading-text">Loading GitHub Users...</div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="header">
            <h1>GitHub Profiles</h1>
            <p>Discover real GitHub profiles and repositories</p>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="Search GitHub username...">
            <button class="btn-batman" onclick="searchUser()">Search User</button>
            <button class="btn-batman" onclick="loadRandomUsers()">Load Random Users</button>
            <button class="btn-batman" onclick="loadAllUsers()">Load All Users</button>
        </div>

        <div id="loadingMessage" class="loading-message" style="display: none;">
            Fetching users from GitHub API...
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <div class="profiles-grid" id="profilesGrid">
            <!-- Users will be loaded here dynamically -->
        </div>
    </div>

    <script>
        let currentUsers = [];
        let currentPage = 1;

        // API Functions
        async function fetchAllUsers(page = 1, perPage = 30) {
            try {
                const response = await fetch(`https://api.github.com/users?page=${page}&per_page=${perPage}`);
                if (response.status === 200) {
                    return await response.json();
                }
                throw new Error(`HTTP ${response.status}`);
            } catch (error) {
                console.error('Error fetching users:', error);
                showError('Failed to fetch users from GitHub API');
                return [];
            }
        }

        async function fetchUserDetails(username) {
            try {
                const response = await fetch(`https://api.github.com/users/${username}`);
                if (response.status === 200) {
                    return await response.json();
                } else if (response.status === 404) {
                    showError(`User "${username}" not found`);
                    return null;
                }
                throw new Error(`HTTP ${response.status}`);
            } catch (error) {
                console.error('Error fetching user details:', error);
                showError('Failed to fetch user details');
                return null;
            }
        }

        async function fetchMultipleUsers(usernames) {
            showLoading(true);
            const promises = usernames.map(username => fetchUserDetails(username));
            const results = await Promise.all(promises);
            showLoading(false);
            return results.filter(user => user !== null);
        }

        // UI Functions
        function showLoading(show) {
            document.getElementById('loadingMessage').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function displayUsers(users) {
            const grid = document.getElementById('profilesGrid');
            grid.innerHTML = '';

            users.forEach(user => {
                const userCard = createUserCard(user);
                grid.appendChild(userCard);
            });
        }

        function createUserCard(user) {
            const card = document.createElement('div');
            card.className = 'profile-card';
            
            const bio = user.bio || user.description || 'No bio available';
            const name = user.name || user.login;
            
            card.innerHTML = `
                <img src="${user.avatar_url}" alt="${user.login}" class="profile-avatar">
                <div class="profile-username">@${user.login}</div>
                <div class="profile-description">${bio}</div>
                <a href="${user.html_url}" target="_blank" class="btn-batman">View Profile</a>
            `;
            
            return card;
        }

        // Main Functions
        async function loadAllUsers() {
            showLoading(true);
            const users = await fetchAllUsers(currentPage, 30);
            showLoading(false);
            
            if (users.length > 0) {
                currentUsers = users;
                displayUsers(users);
                currentPage++;
            }
        }

        async function loadRandomUsers() {
            showLoading(true);
            // Get random users by fetching from a random page
            const randomPage = Math.floor(Math.random() * 100) + 1;
            const users = await fetchAllUsers(randomPage, 20);
            showLoading(false);
            
            if (users.length > 0) {
                currentUsers = users;
                displayUsers(users);
            }
        }

        async function searchUser() {
            const username = document.getElementById('searchInput').value.trim();
            if (!username) {
                showError('Please enter a username');
                return;
            }

            showLoading(true);
            const user = await fetchUserDetails(username);
            showLoading(false);

            if (user) {
                currentUsers = [user];
                displayUsers([user]);
                document.getElementById('searchInput').value = '';
            }
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchUser();
            }
        });

        // Loading animation control
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                
                setTimeout(function() {
                    loader.style.display = 'none';
                    // Load initial users
                    loadRandomUsers();
                }, 500);
            }, 2000);
        });
    </script>
</body>
</html>
